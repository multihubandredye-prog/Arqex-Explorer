name: Arqex Explorer - build, verificar e publicar

# Regras:
#  - push em qualquer branch  -> testes + build + pre-release (branch de trabalho) ou release estavel (branch padrao)
#  - pull_request             -> apenas testes/build; nunca publica release
#  - nenhuma tag/release existente e sobrescrita

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arqex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar DEX/APK, testar e assinar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      has_apk: ${{ steps.sign.outputs.has_apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android build-tools (zipalign/apksigner/aapt2)
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "${BT:-}" ]; then
            SDKMANAGER=$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
            [ -n "${SDKMANAGER:-}" ] || { echo "::error::sdkmanager nao encontrado"; exit 1; }
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "build-tools;34.0.0" >/dev/null || { echo "::error::falha ao instalar build-tools"; exit 1; }
            BT=$(ls -d "$SDK"/build-tools/* 2>/dev/null | sort -V | tail -1)
          fi
          [ -x "$BT/zipalign" ] || { echo "::error::zipalign ausente em $BT"; exit 1; }
          [ -x "$BT/apksigner" ] || { echo "::error::apksigner ausente em $BT"; exit 1; }
          echo "build-tools: $BT"
          "$BT/zipalign" 2>&1 | head -1 || true
          echo "$BT" >> "$GITHUB_PATH"

      - name: Cache das ferramentas de build
        uses: actions/cache@v4
        with:
          path: ~/.cache/arqex-tools
          key: arqex-tools-baksmali252-smali252-apktool303

      - name: Calcular proxima versao (tags + releases reais, paginado)
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          BASE_VERSION_CODE: "26090412"
        run: python3 tools/next_version.py

      - name: Compilar DEX + APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: bash tools/build.sh

      - name: Conferir se app/classes.dex corresponde a app/smali
        run: |
          if cmp -s out/classes.dex app/classes.dex; then
            echo "OK: app/classes.dex esta em sincronia com app/smali"
          else
            echo "::warning::app/classes.dex difere do smali recompilado. O release usa o DEX recompilado; rode 'bash tools/build.sh' e commite app/classes.dex para manter a sincronia."
          fi

      - name: Testes estaticos do smali final
        run: |
          python3 tests/test_smali_invariants.py out/fontes_smali app/res
          python3 tests/test_dex_consistency.py out/fontes_smali

      - name: Conferir metadados do APK (manifesto, versao, recursos, libs)
        run: |
          aapt2 dump badging out/Arqex-unsigned.apk > "$RUNNER_TEMP/badging.txt" || aapt dump badging out/Arqex-unsigned.apk > "$RUNNER_TEMP/badging.txt"
          grep -E "^package:" "$RUNNER_TEMP/badging.txt"
          echo "--- versao esperada: ${{ steps.version.outputs.version_name }} (code ${{ steps.version.outputs.version_code }})"
          grep -q "versionName='${{ steps.version.outputs.version_name }}'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::versionName no APK nao confere com a calculada"; exit 1; }
          grep -q "versionCode='${{ steps.version.outputs.version_code }}'" "$RUNNER_TEMP/badging.txt" \
            || { echo "::error::versionCode no APK nao confere com o calculado"; exit 1; }
          echo "locales no APK: $(grep -c '^locales:' "$RUNNER_TEMP/badging.txt" || true)"
          grep -c "^native-code:" "$RUNNER_TEMP/badging.txt" || true
          grep "^native-code:" "$RUNNER_TEMP/badging.txt" || echo "::warning::sem bibliotecas nativas declaradas"

      - name: Assinar o APK
        id: sign
        env:
          ARQEX_KEYSTORE_B64: ${{ secrets.ARQEX_KEYSTORE_B64 }}
          ARQEX_KEY_ALIAS: ${{ secrets.ARQEX_KEY_ALIAS }}
          ARQEX_STORE_PASSWORD: ${{ secrets.ARQEX_STORE_PASSWORD }}
          ARQEX_KEY_PASSWORD: ${{ secrets.ARQEX_KEY_PASSWORD }}
          ARQEX_SIGNER_SHA256: ${{ vars.ARQEX_SIGNER_SHA256 }}
        run: |
          set -uo pipefail
          present=0
          for n in ARQEX_KEYSTORE_B64 ARQEX_KEY_ALIAS ARQEX_STORE_PASSWORD ARQEX_KEY_PASSWORD; do
            [ -n "${!n:-}" ] && present=$((present+1))
          done
          echo "secrets de assinatura presentes: $present/4"

          if [ "$present" -eq 4 ]; then
            if [ -z "${ARQEX_SIGNER_SHA256:-}" ]; then
              echo "::error::Variable ARQEX_SIGNER_SHA256 ausente: impossivel verificar o certificado. Nada sera publicado."
              exit 1
            fi
            KS="$RUNNER_TEMP/arqex-keystore.jks"
            ALIAS="$ARQEX_KEY_ALIAS"
            STORE_PASS="$ARQEX_STORE_PASSWORD"
            KEY_PASS="$ARQEX_KEY_PASSWORD"
            EXPECTED="$ARQEX_SIGNER_SHA256"
            printf '%s' "$ARQEX_KEYSTORE_B64" | base64 -d > "$KS" || { echo "::error::ARQEX_KEYSTORE_B64 invalido"; exit 1; }
          elif [ "$present" -eq 0 ]; then
            # Sem secrets: usa a chave que esta no proprio repositorio. Nao serve para
            # publicar na Play Store, mas resolve instalacao por cima em uso proprio.
            KS="signing/arqex-release.jks"
            if [ ! -f "$KS" ]; then
              echo "has_apk=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Sem chave de assinatura. O release sai sem APK."
              exit 0
            fi
            ALIAS="arqex"
            STORE_PASS="arqex-release"
            KEY_PASS="arqex-release"
            EXPECTED="$(cat signing/signer-sha256.txt)"
            echo "::notice::Assinando com a chave do repositorio (signing/arqex-release.jks)."
          else
            echo "::error::Configuracao de assinatura PARCIAL ($present/4 secrets). Nada sera publicado."
            exit 1
          fi

          export ARQEX_STORE_PASSWORD="$STORE_PASS"
          export ARQEX_KEY_PASSWORD="$KEY_PASS"
          zipalign -f -p 4 out/Arqex-unsigned.apk out/Arqex-aligned.apk
          apksigner sign \
            --ks "$KS" --ks-key-alias "$ALIAS" \
            --ks-pass "env:ARQEX_STORE_PASSWORD" --key-pass "env:ARQEX_KEY_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out out/Arqex-signed.apk out/Arqex-aligned.apk || { echo "::error::apksigner falhou"; exit 1; }

          apksigner verify --verbose --print-certs out/Arqex-signed.apk | tee out/signature-report.txt
          actual=$(grep -oE "SHA-256 digest: [0-9a-f]+" out/signature-report.txt | head -1 | awk '{print $3}')
          expected=$(printf '%s' "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')
          echo "certificado do APK: $actual"
          echo "certificado esperado: $expected"
          if [ "${actual:-}" != "$expected" ]; then
            echo "::error::O SHA-256 do certificado nao confere. APK NAO sera publicado."
            exit 1
          fi
          echo "has_apk=true" >> "$GITHUB_OUTPUT"

      - name: Empacotar o projeto pronto para compilar
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          rm -rf pkg && mkdir -p pkg
          cp -a out/projeto pkg/projeto
          cp -a patches tools tests docs pkg/ 2>/dev/null || true
          cp README.md pkg/ 2>/dev/null || true
          cat > pkg/COMO_COMPILAR.txt <<'TXT'
          ARQEX EXPLORER - codigo-fonte pronto para compilar

            1) apktool b projeto -o app-sem-assinatura.apk
            2) (opcional) apksigner sign --ks sua-chave.jks app-sem-assinatura.apk

          A pasta projeto/ ja tem AndroidManifest.xml, apktool.yml, classes.dex e res/,
          entao compila direto. O ZIP que fica na raiz do repositorio NAO compila
          sozinho porque nao tem apktool.yml nem resources.arsc.

          tests/  - testes estaticos: python3 tests/test_smali_invariants.py <smali> <res>
          tools/  - build.sh remonta o DEX/APK a partir de projeto/smali
          docs/   - VALIDACAO.md, com o que foi conferido e o que segue pendente
          TXT
          for need in projeto/apktool.yml projeto/AndroidManifest.xml projeto/classes.dex projeto/res; do
            [ -e "pkg/$need" ] || { echo "::error::pacote sem $need"; exit 1; }
          done
          (cd pkg && zip -qr "../Arqex-$V.zip" .)
          rm -rf pkg
          if [ -f out/Arqex-signed.apk ]; then
            cp out/signature-report.txt . || true
            cp out/Arqex-signed.apk "Arqex-$V.apk"
          fi
          test -s "Arqex-$V.zip" || { echo "::error::ZIP do projeto nao foi gerado"; exit 1; }
          sha256sum "Arqex-$V.zip"

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: arqex-${{ steps.version.outputs.version }}
          path: |
            Arqex-*.zip
            Arqex-*.apk
            signature-report.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publicar release (somente push, nunca em PR)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: arqex-${{ needs.build.outputs.version }}

      - name: Criar tag e release sem sobrescrever nada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          HAS_APK: ${{ needs.build.outputs.has_apk }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::A release $TAG ja existe. Nada sera sobrescrito."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::warning::A tag $TAG ja existe. Nada sera sobrescrito."
            exit 0
          fi

          PREV="$(git describe --tags --abbrev=0 "$SHA^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            echo "changelog desde $PREV"
            git log --pretty='- %s' "$PREV..$SHA" | head -40 > changelog.txt
          else
            git log --pretty='- %s' -15 "$SHA" > changelog.txt
          fi

          {
            echo "**Arqex Explorer $TAG**"
            echo
            echo "Novidades desta versao:"
            echo
            cat changelog.txt
            echo
            echo "### Como instalar"
            echo
            echo "1. Baixe \`Arqex-$TAG.apk\` (aceite o aviso de fonte desconhecida)."
            echo "2. Toque no arquivo baixado para instalar. Atualiza por cima da versao"
            echo "   anterior: a assinatura e a mesma, nao precisa desinstalar."
            echo
            echo "### Codigo-fonte"
            echo
            echo "\`Arqex-$TAG.zip\` traz a pasta \`projeto/\` pronta para compilar:"
            echo
            echo "\`\`\`"
            echo "apktool b projeto -o app-sem-assinatura.apk"
            echo "\`\`\`"
            echo
            echo "SHA-256 do ZIP: $(sha256sum Arqex-*.zip | awk '{print $1}')"
            if [ "$HAS_APK" = "true" ]; then
              echo
              echo "SHA-256 do APK: $(sha256sum Arqex-*.apk | awk '{print $1}')"
            else
              echo
              echo "Sem APK nesta release: nenhuma chave de assinatura configurada."
            fi
          } > notes.md

          args=(--title "Arqex Explorer $TAG" --notes-file notes.md --target "$SHA")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          else
            git fetch --quiet origin "$DEFAULT_BRANCH" || true
            MAIN_SHA=$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || echo "")
            if [ "$SHA" = "$MAIN_SHA" ]; then
              args+=(--latest)
            else
              args+=(--latest=false)
              echo "::notice::Commit nao e o HEAD atual de $DEFAULT_BRANCH: nao sera marcado como Latest."
            fi
          fi

          mapfile -t assets < <(ls Arqex-*.zip Arqex-*.apk 2>/dev/null || true)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::nenhum arquivo para anexar"; exit 1
          fi
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
          echo "release publicada: $TAG"
